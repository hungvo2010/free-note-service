# Host-run config: infra services (postgres/redis/cassandra/jaeger/apicurio)
# run in Docker on 127.0.0.1, the Java app runs directly on the host.
# See free-draw/build.gradle `runFreeNote`.

freenote.profiles.active=default
freenote.active.port=8189
freenote.connection.type=thread-per-connection
freenote.server.type=thread-per-connection

# No TLS on the host; terminate it in front if needed.
server.ssl.enabled=false

allowed.origins=https://free-note-ui.vercel.app,https://home-laptop-server.tail71ae46.ts.net

# Docker Compose publishes these on 127.0.0.1.
apicurio.registry.url=http://localhost:9081/apis/registry/v2
otlp.http.endpoint=http://localhost:4318/v1/traces
otlp.grpc.endpoint=http://localhost:4317

prometheus.host=0.0.0.0
prometheus.port=9464

freenote.target.directory=
