# Runtime config for the containerized (non-TLS) FreeNote server.
# Mounted into the container at /config, which is placed FIRST on the
# classpath, so every key here overrides the copy baked into the jar.

freenote.profiles.active=default
freenote.active.port=8189
freenote.connection.type=nio
freenote.server.type=nio

# TLS is terminated by `tailscale serve` on the host, so the app speaks plain
# HTTP/WebSocket on loopback only.
server.ssl.enabled=false

# WebSocket handshake Origin whitelist (comma separated).
# The browser sends the *page* origin.
allowed.origins=https://free-note-ui.vercel.app,https://home-laptop-server.tail71ae46.ts.net

# Dependency endpoints, resolved by Docker Compose DNS.
apicurio.registry.url=http://apicurio-registry:8080/apis/registry/v2
otlp.http.endpoint=http://jaeger:4318/v1/traces
otlp.grpc.endpoint=http://jaeger:4317

# Prometheus metrics exporter
prometheus.host=0.0.0.0
prometheus.port=9464

# Disk persistence target directory (empty = platform default)
freenote.target.directory=
