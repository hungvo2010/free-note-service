global
    log stdout format raw local0
    maxconn 10000

    # TLS defaults inherited by every bind
    ssl-default-bind-options ssl-min-ver TLSv1.2

# Docker's embedded DNS, used to re-resolve backends at runtime.
resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    option  redispatch
    retries 3
    timeout connect      5s
    timeout client       30s
    timeout server       30s
    timeout http-request 10s
    # Long-lived WebSocket sessions: once upgraded, HAProxy switches to tunnel timeouts
    timeout tunnel      1h

# ---------------------------------------------------------------------------
# Plain HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
frontend http_in
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }

# ---------------------------------------------------------------------------
# TLS termination. Keep ALPN at http/1.1 (no h2): WebSocket upgrade over
# HTTP/2 needs Extended CONNECT, which HAProxy does not proxy for this stack.
# ---------------------------------------------------------------------------
frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/full.pem alpn http/1.1
    default_backend free_note_backend

# ---------------------------------------------------------------------------
# Backends are the RAW, non-TLS FreeNote WebSocket servers on :8189.
# ---------------------------------------------------------------------------
backend free_note_backend
    balance leastconn

    # Plain TCP check: the server only speaks WebSocket, there is no /health
    # endpoint, so an HTTP check would mark healthy instances as DOWN.
    # Do NOT enable "option httpchk GET /..." here.
    server app1 app1:8189 check resolvers docker init-addr last,libc,none
    server app2 app2:8189 check resolvers docker init-addr last,libc,none
    server app3 app3:8189 check resolvers docker init-addr last,libc,none

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    # stats auth admin:change-me
