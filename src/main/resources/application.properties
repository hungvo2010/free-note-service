# application.properties
db.host=localhost

# SSL Server Configuration
server.ssl.port=8189
server.ssl.keystore.path=keystore.p12
server.ssl.keystore.password=changeit

# WebSocket handshake: comma-separated list of additional allowed origins
allowed.origins=

# Disk persistence target directory (leave empty to use the platform default)
freenote.target.directory=

# Apicurio Schema Registry
apicurio.registry.url=http://home-laptop-server:8080/apis/registry/v2

# OpenTelemetry OTLP exporter endpoints
otlp.http.endpoint=http://home-laptop-server:4318/v1/traces
otlp.grpc.endpoint=http://home-laptop-server:4317

# Prometheus metrics exporter endpoint the app exposes for scraping
# (prometheus.yml scrapes this at host:9464/metrics)
prometheus.host=0.0.0.0
prometheus.port=9464
